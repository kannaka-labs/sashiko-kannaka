# Per-mailing-list configuration for Sashiko Kannaka (--project kannaka).
# Kannaka Labs reviews run locally against a commit and post nothing, so no list
# is tracked and every outbound message is muted.

[defaults]
track = false
embargo_hours = 0
reply_to = []
positive_review = "none"
mute_all = true
cc = []
ignored_emails = []
